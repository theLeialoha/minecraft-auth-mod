modLoader = "javafml"
loaderVersion = "*"
license = "GPL"
issueTrackerURL = "https://github.com/example/example_mod/issues"
[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_display_name}"
updateJSONURL = "https://update.example.com/neoforge/example_mod"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/example-mod"
logoFile = "icon.png"
authors = "Example Author"
credits = "Modding Community"
description = '''Example mod description'''
displayTest = "IGNORE_ALL_VERSION"
[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_dependency}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "cloth_config"
type = "optional"
versionRange = "[${cloth_config_version},)"
ordering = "AFTER"
side = "BOTH"
